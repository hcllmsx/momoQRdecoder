name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      edge_publish:
        description: '上传 zip 后是否立即提交发布到 Edge 商店（true=发布，false=仅上传草稿）'
        required: false
        default: 'true'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Edge Add-ons 发布开关与 API 凭据（来自仓库 Secrets，未配置则相关步骤自动跳过）
    env:
      EDGE_AUTO_PUBLISH: ${{ inputs.edge_publish || 'true' }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 版本号唯一来源是 VERSION 文件（与 README「开发者说明」一致）
      - name: Read version from VERSION
        id: version
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"
          echo "读取到版本号: ${VER}"

      # 由 tag 触发时，校验 tag 与 VERSION 一致，避免版本漂移
      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="${{ steps.version.outputs.version }}"
          if [ "${TAG}" != "${VER}" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' 与 VERSION(${VER}) 不一致，请打 tag: v${VER}"
            exit 1
          fi
          echo "tag 校验通过: ${GITHUB_REF_NAME}"

      # 将 VERSION 同步进两份 manifest（Chromium / Firefox），保证发布包内版本号一致
      - name: Sync version into manifests
        run: |
          VER="${{ steps.version.outputs.version }}"
          python3 - "${VER}" <<'PY'
          import json, sys
          ver = sys.argv[1]
          for path in ('manifest.json', 'firefox/manifest.json'):
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
              data['version'] = ver
              with open(path, 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
                  f.write('\n')
              print(f'{path} version -> {ver}')
          PY

      # 发布前统一处理（去 dev 后缀、移除诊断区、剔除平台专属文件等）
      # 规则集中在 tools/prepare-release.js，与本地 build.ps1 调用同一脚本，保证两条路径一致
      # 两版分别在自己的暂存目录处理，平台专属规则互不影响：
      # 例如 --target firefox 会移除 Chromium 专属的 src/offscreenChrome.js
      - name: Prepare Chromium package
        run: |
          rm -rf chrome-dist
          mkdir -p chrome-dist
          cp manifest.json chrome-dist/
          cp -r _locales src chrome-dist/
          node tools/prepare-release.js chrome-dist --target chromium

      # 打包 Chrome 扩展：manifest.json + src/（含 models 与 icon）
      # 注意：zip 路径必须用干净的相对路径（manifest.json、src），
      # 不能带 ../ ，否则 zip 内会出现父目录访问器，商店上传会被拒绝
      - name: Build Chrome extension zip
        run: |
          mkdir -p dist
          cd chrome-dist
          zip -r "../dist/momoQRdecoder-chrome-v${{ steps.version.outputs.version }}.zip" manifest.json _locales src
          unzip -l "../dist/momoQRdecoder-chrome-v${{ steps.version.outputs.version }}.zip"
          cd ..
          ls -lh dist/

      # 打包 Firefox 扩展：Firefox 要求 manifest.json 位于包根，
      # 因此单独组装（firefox 清单 + _locales + src）。
      - name: Prepare Firefox package
        run: |
          rm -rf firefox-dist
          mkdir -p firefox-dist
          cp firefox/manifest.json firefox-dist/manifest.json
          cp -r _locales src firefox-dist/
          node tools/prepare-release.js firefox-dist --target firefox

      - name: Build Firefox extension zip
        run: |
          mkdir -p dist
          cd firefox-dist
          zip -r "../dist/momoQRdecoder-firefox-v${{ steps.version.outputs.version }}.zip" manifest.json _locales src
          unzip -l "../dist/momoQRdecoder-firefox-v${{ steps.version.outputs.version }}.zip"
          cd ..
          ls -lh dist/

      # 计算 SHA256 校验值，直接写进 Release 说明（不再额外生成 SHA256SUMS.txt 附件）
      # 用 heredoc 写入 GITHUB_ENV：两个 zip 会产生多行，普通的 KEY=value 写法会解析失败
      - name: Generate SHA256 checksums
        run: |
          cd dist
          SHA=$(sha256sum *.zip)
          printf '%s\n' "${SHA}"
          {
            echo 'SHA<<EOF'
            echo "${SHA}"
            echo 'EOF'
          } >> "${GITHUB_ENV}"
          cd ..

      # 从 CHANGELOG.md 截取当前版本的小节，作为 Release 的「更新日志」
      # 多行内容用 heredoc 写入 GITHUB_ENV
      - name: Read changelog for this version
        run: |
          python3 - "${{ steps.version.outputs.version }}" <<'PY' >> "${GITHUB_ENV}"
          import sys

          sys.stdout.reconfigure(encoding='utf-8')

          ver = sys.argv[1]
          lines = open('CHANGELOG.md', encoding='utf-8').read().splitlines()

          section = []
          started = False
          for line in lines:
              if not started:
                  if line.strip() == f'## v{ver}':
                      started = True
                  continue
              if line.startswith('## v'):
                  break
              section.append(line)

          body = '\n'.join(section).strip()
          if not body:
              print(f'CHANGELOG.md 中没有 v{ver} 的条目，使用默认文案', file=sys.stderr)
              body = '- 暂无更新说明'

          print('CHANGELOG_SECTION<<EOF')
          print(body)
          print('EOF')
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: momoQRdecoder v${{ steps.version.outputs.version }}
          body: |
            ## momoQRdecoder v${{ steps.version.outputs.version }}

            ### 更新日志
            ${{ env.CHANGELOG_SECTION }}

            ### 安装
            > **Edge 用户**：插件已上架 Edge 扩展商店，可直接在商店安装。

            > **Firefox 用户**：Firefox 版已上架 AMO 商店，推荐直接安装：[momoQRdecoder – Firefox Add-ons](https://addons.mozilla.org/zh-CN/firefox/addon/momoqrdecoder/)。附件里的 zip 未签名，仅供开发测试，正式版 Firefox 无法直接安装。

            **Chrome / 其他 Chromium 浏览器**
            1. 下载 `momoQRdecoder-chrome-v${{ steps.version.outputs.version }}.zip`
            2. 解压后，在浏览器扩展管理页开启「开发者模式」
            3. 点击「加载已解压的扩展程序」，选择解压出的文件夹

            ### 校验（SHA256）
            ```
            ${{ env.SHA }}
            ```

            > 校验方法：在下载目录执行 `sha256sum momoQRdecoder-chrome-v${{ steps.version.outputs.version }}.zip`（Linux/macOS）
            > 或 `Get-FileHash .\momoQRdecoder-chrome-v${{ steps.version.outputs.version }}.zip -Algorithm SHA256`（Windows），
            > 把结果与上面的哈希逐字比对即可。
          files: |
            dist/*.zip

      # ============ 自动发布到 Microsoft Edge Add-ons（可选） ============
      # 前提：Partner Center -> Publish API 启用并创建 API 凭据（新版 v1.1：Client ID + API Key）
      # 需要配置仓库 Secrets：EDGE_CLIENT_ID、EDGE_API_KEY、EDGE_PRODUCT_ID（Product ID 为扩展 GUID）
      # 未配置任一 Secret 时，本组步骤自动跳过，不影响 GitHub Release 发布

      - name: Upload zip to Edge Add-ons
        if: env.EDGE_CLIENT_ID != '' && env.EDGE_API_KEY != '' && env.EDGE_PRODUCT_ID != ''
        run: |
          set -euo pipefail
          ZIP="dist/momoQRdecoder-chrome-v${{ steps.version.outputs.version }}.zip"
          URL="https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions/draft/package"
          HTTP_CODE=$(curl -sS -D edge_upload_headers.txt -o edge_upload_body.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: ApiKey ${EDGE_API_KEY}" \
            -H "X-ClientID: ${EDGE_CLIENT_ID}" \
            -H "Content-Type: application/zip" \
            --data-binary "@${ZIP}" \
            "${URL}")
          echo "Edge 上传 HTTP: ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "202" ]; then
            echo "::error::Edge 上传失败 (HTTP ${HTTP_CODE})"
            cat edge_upload_body.json
            exit 1
          fi
          OPERATION_ID=$(grep -i '^Location:' edge_upload_headers.txt | tr -d '\r' | awk '{print $2}' | awk -F'/' '{print $NF}')
          echo "Edge 上传操作 ID: ${OPERATION_ID}"
          echo "EDGE_UPLOAD_OP=${OPERATION_ID}" >> "${GITHUB_ENV}"

      - name: Wait for Edge upload to finish
        if: env.EDGE_CLIENT_ID != '' && env.EDGE_API_KEY != '' && env.EDGE_PRODUCT_ID != ''
        run: |
          set -euo pipefail
          URL="https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions/draft/package/operations/${EDGE_UPLOAD_OP}"
          for i in $(seq 1 60); do
            RESP=$(curl -sS \
              -H "Authorization: ApiKey ${EDGE_API_KEY}" \
              -H "X-ClientID: ${EDGE_CLIENT_ID}" \
              "${URL}")
            STATUS=$(printf '%s' "${RESP}" | python3 -c 'import sys, json; print(json.load(sys.stdin).get("status", ""))')
            echo "上传状态 #${i}: ${STATUS}"
            case "${STATUS}" in
              Succeeded) echo "Edge 上传完成"; exit 0 ;;
              Failed)    echo "::error::Edge 上传失败: ${RESP}"; exit 1 ;;
              *)         sleep 10 ;;
            esac
          done
          echo "::error::等待 Edge 上传超时（约 10 分钟）"; exit 1

      - name: Publish to Edge Add-ons
        if: env.EDGE_AUTO_PUBLISH == 'true' && env.EDGE_CLIENT_ID != '' && env.EDGE_API_KEY != '' && env.EDGE_PRODUCT_ID != ''
        run: |
          set -euo pipefail
          NOTES="momoQRdecoder v${{ steps.version.outputs.version }} 自动发布（GitHub Actions）"
          URL="https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions"
          HTTP_CODE=$(curl -sS -D edge_pub_headers.txt -o edge_pub_body.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: ApiKey ${EDGE_API_KEY}" \
            -H "X-ClientID: ${EDGE_CLIENT_ID}" \
            -H "Content-Type: application/json" \
            -d "{\"notes\": \"${NOTES}\"}" \
            "${URL}")
          echo "Edge 发布提交 HTTP: ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "202" ]; then
            echo "::error::Edge 发布提交失败 (HTTP ${HTTP_CODE})"
            cat edge_pub_body.json
            exit 1
          fi
          OPERATION_ID=$(grep -i '^Location:' edge_pub_headers.txt | tr -d '\r' | awk '{print $2}' | awk -F'/' '{print $NF}')
          echo "Edge 发布操作 ID: ${OPERATION_ID}"
          echo "EDGE_PUBLISH_OP=${OPERATION_ID}" >> "${GITHUB_ENV}"

      - name: Wait for Edge publish status
        if: env.EDGE_AUTO_PUBLISH == 'true' && env.EDGE_CLIENT_ID != '' && env.EDGE_API_KEY != '' && env.EDGE_PRODUCT_ID != ''
        run: |
          set -euo pipefail
          URL="https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions/operations/${EDGE_PUBLISH_OP}"
          for i in $(seq 1 60); do
            RESP=$(curl -sS \
              -H "Authorization: ApiKey ${EDGE_API_KEY}" \
              -H "X-ClientID: ${EDGE_CLIENT_ID}" \
              "${URL}")
            STATUS=$(printf '%s' "${RESP}" | python3 -c 'import sys, json; print(json.load(sys.stdin).get("status", ""))')
            echo "发布状态 #${i}: ${STATUS}"
            case "${STATUS}" in
              Succeeded) echo "Edge 已提交发布，等待商店审核"; exit 0 ;;
              Failed)    echo "::error::Edge 发布失败: ${RESP}"; exit 1 ;;
              *)         sleep 10 ;;
            esac
          done
          echo "::warning::Edge 发布状态轮询超时（仍在处理中），请到 Partner Center 查看进度"
