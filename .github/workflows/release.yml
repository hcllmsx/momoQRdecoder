name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      edge_publish:
        description: '上传 zip 后是否立即提交发布到 Edge 商店（true=发布，false=仅上传草稿）'
        required: false
        default: 'true'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Edge Add-ons 发布开关与 API 凭据（来自仓库 Secrets，未配置则相关步骤自动跳过）
    env:
      EDGE_AUTO_PUBLISH: ${{ inputs.edge_publish || 'true' }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 版本号唯一来源是 VERSION 文件（与 README「开发者说明」一致）
      - name: Read version from VERSION
        id: version
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"
          echo "读取到版本号: ${VER}"

      # 由 tag 触发时，校验 tag 与 VERSION 一致，避免版本漂移
      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="${{ steps.version.outputs.version }}"
          if [ "${TAG}" != "${VER}" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' 与 VERSION(${VER}) 不一致，请打 tag: v${VER}"
            exit 1
          fi
          echo "tag 校验通过: ${GITHUB_REF_NAME}"

      # 将 VERSION 同步进 manifest.json，保证发布包内版本号一致
      - name: Sync version into manifest.json
        run: |
          VER="${{ steps.version.outputs.version }}"
          python3 -c "
          import json, sys
          path = 'manifest.json'
          with open(path, encoding='utf-8') as f:
              data = json.load(f)
          data['version'] = sys.argv[1]
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          " "${VER}"
          echo "manifest.json version -> ${VER}"

      # 打包 Chrome 扩展：manifest.json + src/（含 models 与 icon）
      # 注意：zip 路径必须用干净的相对路径（manifest.json、src），
      # 不能带 ../ ，否则 zip 内会出现父目录访问器，商店上传会被拒绝
      - name: Build extension zip
        run: |
          mkdir -p dist
          zip -r "dist/momoQRdecoder-v${{ steps.version.outputs.version }}.zip" manifest.json _locales src
          # 打印 zip 内容清单，确认无 ../ 父目录访问器
          unzip -l "dist/momoQRdecoder-v${{ steps.version.outputs.version }}.zip"
          ls -lh dist/

      # 生成 SHA256 校验文件（发布后可用 sha256sum -c 验证下载包完整性）
      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "SHA=$(cat SHA256SUMS.txt)" >> "${GITHUB_ENV}"
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: momoQRdecoder v${{ steps.version.outputs.version }}
          body: |
            ## momoQRdecoder v${{ steps.version.outputs.version }}

            ### 安装
            > **Edge 用户**：插件已提交 Edge 扩展商店审核，审核通过后可直接在商店安装；以下手动安装方式适用于 **Chrome** 及其他 Chromium 浏览器。

            1. 下载 `momoQRdecoder-v${{ steps.version.outputs.version }}.zip`
            2. 解压后，在浏览器扩展管理页开启「开发者模式」
            3. 点击「加载已解压的扩展程序」，选择解压出的文件夹

            ### 校验（SHA256）
            ```
            ${{ env.SHA }}
            ```

            > 校验方法：`sha256sum -c SHA256SUMS.txt`（Linux/macOS）或 `Get-FileHash`（Windows）
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true

      # ============ 自动发布到 Microsoft Edge Add-ons（可选） ============
      # 前提：Partner Center -> Publish API 启用并创建 API 凭据（新版 v1.1：Client ID + API Key）
      # 需要配置仓库 Secrets：EDGE_CLIENT_ID、EDGE_API_KEY、EDGE_PRODUCT_ID（Product ID 为扩展 GUID）
      # 未配置任一 Secret 时，本组步骤自动跳过，不影响 GitHub Release 发布

      - name: Upload zip to Edge Add-ons
        if: env.EDGE_CLIENT_ID != '' && env.EDGE_API_KEY != '' && env.EDGE_PRODUCT_ID != ''
        run: |
          set -euo pipefail
          ZIP="dist/momoQRdecoder-v${{ steps.version.outputs.version }}.zip"
          URL="https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions/draft/package"
          HTTP_CODE=$(curl -sS -D edge_upload_headers.txt -o edge_upload_body.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: ApiKey ${EDGE_API_KEY}" \
            -H "X-ClientID: ${EDGE_CLIENT_ID}" \
            -H "Content-Type: application/zip" \
            --data-binary "@${ZIP}" \
            "${URL}")
          echo "Edge 上传 HTTP: ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "202" ]; then
            echo "::error::Edge 上传失败 (HTTP ${HTTP_CODE})"
            cat edge_upload_body.json
            exit 1
          fi
          OPERATION_ID=$(grep -i '^Location:' edge_upload_headers.txt | tr -d '\r' | awk '{print $2}' | awk -F'/' '{print $NF}')
          echo "Edge 上传操作 ID: ${OPERATION_ID}"
          echo "EDGE_UPLOAD_OP=${OPERATION_ID}" >> "${GITHUB_ENV}"

      - name: Wait for Edge upload to finish
        if: env.EDGE_CLIENT_ID != '' && env.EDGE_API_KEY != '' && env.EDGE_PRODUCT_ID != ''
        run: |
          set -euo pipefail
          URL="https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions/draft/package/operations/${EDGE_UPLOAD_OP}"
          for i in $(seq 1 60); do
            RESP=$(curl -sS \
              -H "Authorization: ApiKey ${EDGE_API_KEY}" \
              -H "X-ClientID: ${EDGE_CLIENT_ID}" \
              "${URL}")
            STATUS=$(printf '%s' "${RESP}" | python3 -c 'import sys, json; print(json.load(sys.stdin).get("status", ""))')
            echo "上传状态 #${i}: ${STATUS}"
            case "${STATUS}" in
              Succeeded) echo "Edge 上传完成"; exit 0 ;;
              Failed)    echo "::error::Edge 上传失败: ${RESP}"; exit 1 ;;
              *)         sleep 10 ;;
            esac
          done
          echo "::error::等待 Edge 上传超时（约 10 分钟）"; exit 1

      - name: Publish to Edge Add-ons
        if: env.EDGE_AUTO_PUBLISH == 'true' && env.EDGE_CLIENT_ID != '' && env.EDGE_API_KEY != '' && env.EDGE_PRODUCT_ID != ''
        run: |
          set -euo pipefail
          NOTES="momoQRdecoder v${{ steps.version.outputs.version }} 自动发布（GitHub Actions）"
          URL="https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions"
          HTTP_CODE=$(curl -sS -D edge_pub_headers.txt -o edge_pub_body.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: ApiKey ${EDGE_API_KEY}" \
            -H "X-ClientID: ${EDGE_CLIENT_ID}" \
            -H "Content-Type: application/json" \
            -d "{\"notes\": \"${NOTES}\"}" \
            "${URL}")
          echo "Edge 发布提交 HTTP: ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "202" ]; then
            echo "::error::Edge 发布提交失败 (HTTP ${HTTP_CODE})"
            cat edge_pub_body.json
            exit 1
          fi
          OPERATION_ID=$(grep -i '^Location:' edge_pub_headers.txt | tr -d '\r' | awk '{print $2}' | awk -F'/' '{print $NF}')
          echo "Edge 发布操作 ID: ${OPERATION_ID}"
          echo "EDGE_PUBLISH_OP=${OPERATION_ID}" >> "${GITHUB_ENV}"

      - name: Wait for Edge publish status
        if: env.EDGE_AUTO_PUBLISH == 'true' && env.EDGE_CLIENT_ID != '' && env.EDGE_API_KEY != '' && env.EDGE_PRODUCT_ID != ''
        run: |
          set -euo pipefail
          URL="https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions/operations/${EDGE_PUBLISH_OP}"
          for i in $(seq 1 60); do
            RESP=$(curl -sS \
              -H "Authorization: ApiKey ${EDGE_API_KEY}" \
              -H "X-ClientID: ${EDGE_CLIENT_ID}" \
              "${URL}")
            STATUS=$(printf '%s' "${RESP}" | python3 -c 'import sys, json; print(json.load(sys.stdin).get("status", ""))')
            echo "发布状态 #${i}: ${STATUS}"
            case "${STATUS}" in
              Succeeded) echo "Edge 已提交发布，等待商店审核"; exit 0 ;;
              Failed)    echo "::error::Edge 发布失败: ${RESP}"; exit 1 ;;
              *)         sleep 10 ;;
            esac
          done
          echo "::warning::Edge 发布状态轮询超时（仍在处理中），请到 Partner Center 查看进度"
